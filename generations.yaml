generations:
  - name: "First Generation"
    start_year: 2010
    end_year: 2020
    description: "The Citroën C-Zero was a compact all-electric city car that was essentially a rebadged version of the Mitsubishi i-MiEV, produced through a partnership between PSA Peugeot Citroën and Mitsubishi Motors (with the Peugeot iOn being the sister model). The distinctive egg-shaped four-door design prioritized interior space efficiency despite the vehicle's small footprint, measuring just 3.48 meters in length. Powered by a rear-mounted electric motor producing 47 kilowatts (64 HP) and 180 Nm of torque, it drove the rear wheels through a single-speed transmission, offering urban-focused performance with 0-100 km/h acceleration in approximately 15 seconds and a top speed of 130 km/h. The lithium-ion battery was mounted under the floor and provided a real-world range of approximately 130 km on a full charge, with charging possible through standard household outlets (taking about 6 hours) or 400V fast-charging terminals (80% charge in about 30 minutes). The interior was basic but functional, offering seating for four adults and standard features including power steering, ESP, six airbags, power windows, air conditioning, and telematics. Production began in late 2010 and ended in 2020 as the Citroën Ami replaced it. Assembly was performed in Japan (Kurashiki, Okayama, 2010-2012) and Spain (Vigo, Galicia, 2012-2020)."
